    /* ----- Back helpers (sections / pills / CTA) ----- */
    function renderSections(project) {
      let sections = project.sections;
      // Migration: if no sections array but old long_description exists,
      // promote it to a single untitled section so existing data still renders.
      if (!Array.isArray(sections) || sections.length === 0) {
        if (project.long_description) {
          sections = [{ title: '', body: project.long_description }];
        } else if (project.description) {
          sections = [{ title: '', body: project.description }];
        } else {
          return '';
        }
      }
      return sections.map(s => `
        <div class="section">
          ${s.title ? `<h4>${escapeHtml(s.title)}</h4>` : ''}
          <p>${escapeHtml(s.body || '')}</p>
        </div>
      `).join('');
    }

    function renderPills(links) {
      if (!links || !links.length) return '';
      const valid = links.filter(l => l && l.url);
      if (!valid.length) return '';
      return `<div class="pills">${valid.map(l => `
        <a class="pill" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" data-goto>
          ${ICONS[l.icon] || ICONS.link}<span>${escapeHtml(l.label || '')}</span>
        </a>
      `).join('')}</div>`;
    }

    /* Carousel of sister cards — invoked when the project belongs to a
       group of 2+ cards (e.g. CineShift + CineShift.org). Renders one page
       per sister, each with its own header (type, name, variant), tagline,
       sections, pills and CTA. The track starts on the tapped sister's
       index, so the carousel feels anchored to the card you flipped. */
    function renderSiblingCarousel(project) {
      const siblings = Array.isArray(project._siblings) ? project._siblings : [];
      if (siblings.length < 2) return '';
      // Каждая страница карусели — точная копия структуры обычной back-стороны:
      // .back-top (заголовок + close в одну строку), tagline, scroll, pills, cta.
      // Стили совпадают 1-в-1 с не-сестринскими карточками.
      const pagesHtml = siblings.map(s => {
        const variantBadge = s.variant
          ? `<span class="back-variant-badge">${escapeHtml(s.variant)}</span>`
          : '';
        return `
          <div class="variant-page">
            <div class="back-top">
              <div class="back-title">
                ${s.type ? `<p class="back-type">${escapeHtml(s.type)}</p>` : ''}
                <h3>${escapeHtml(s.name)}${variantBadge ? ' ' + variantBadge : ''}</h3>
              </div>
              <button class="close-btn" type="button" aria-label="Закрыть" data-close>${ICON_CLOSE}</button>
            </div>
            ${s.description ? `<p class="back-tagline">${escapeHtml(s.description)}</p>` : ''}
            <div class="scroll">${renderSections(s)}</div>
            ${renderDirections(s.directions || [])}
            ${renderPills(s.links || [])}
            ${renderCta(s)}
          </div>`;
      }).join('');
      const startIdx = Math.max(0, Math.min(siblings.length - 1, project._siblingIdx || 0));
      const dotsHtml = siblings.map((s, i) =>
        `<button type="button" class="variant-dot ${i===startIdx?'active':''}" data-variant-idx="${i}" aria-label="${escapeHtml(s.variant || s.name)}"></button>`
      ).join('');
      return `
        <div class="variant-carousel">
          <div class="variant-viewport">
            <div class="variant-track" data-current="${startIdx}" style="transform: translateX(-${startIdx * 100}%)">${pagesHtml}</div>
          </div>
          <div class="variant-dots">${dotsHtml}</div>
        </div>`;
    }

    /* Legacy carousel for projects with inline variants[] field — kept for
       backwards compatibility but rarely used now (sister cards are the
       preferred pattern). */
    function renderVariantCarousel(project) {
      const variants = Array.isArray(project.variants) ? project.variants.filter(v => v) : [];
      if (variants.length < 2) return '';
      const pagesHtml = variants.map(v => {
        const sec  = Array.isArray(v.sections) ? v.sections : [];
        const sectionsHtml = sec.map(s => `
          <div class="section">
            ${s.title ? `<h4>${escapeHtml(s.title)}</h4>` : ''}
            <p>${escapeHtml(s.body || '')}</p>
          </div>`).join('');
        const cta = v.cta || {};
        const ctaUrl = cta.url || project.url || '';
        const ctaLabel = cta.label || (ctaUrl ? 'Перейти' : '');
        const ctaHtml = ctaUrl
          ? `<a class="goto" href="${escapeHtml(ctaUrl)}" target="_blank" rel="noopener noreferrer" data-goto>${escapeHtml(ctaLabel)}${urlHost(ctaUrl) ? ' · ' + escapeHtml(urlHost(ctaUrl)) : ''}</a>`
          : `<span class="goto disabled">Ссылка скоро</span>`;
        return `
          <div class="variant-page">
            ${v.label  ? `<p class="variant-label">${escapeHtml(v.label)}</p>` : ''}
            ${v.description ? `<p class="back-tagline">${escapeHtml(v.description)}</p>` : ''}
            <div class="scroll">${sectionsHtml}</div>
            ${renderPills(v.links || [])}
            ${ctaHtml}
          </div>`;
      }).join('');
      const dotsHtml = variants.map((v, i) =>
        `<button type="button" class="variant-dot ${i===0?'active':''}" data-variant-idx="${i}" aria-label="${escapeHtml(v.label || ('Вариант ' + (i+1)))}"></button>`
      ).join('');
      return `
        <div class="variant-carousel">
          <div class="variant-viewport">
            <div class="variant-track" data-current="0">${pagesHtml}</div>
          </div>
          <div class="variant-dots">${dotsHtml}</div>
        </div>`;
    }

    function renderDirections(directions) {
      if (!Array.isArray(directions) || !directions.length) return '';
      const valid = directions.filter(d => d && (d.title || d.body));
      if (!valid.length) return '';
      return `<div class="directions">${valid.map(d => {
        const tag = d.url ? 'a' : 'div';
        const href = d.url ? `href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" data-goto` : '';
        return `
        <${tag} class="direction" ${href}>
          <div class="dir-body">
            ${d.title ? `<div class="dir-title">${escapeHtml(d.title)}</div>` : ''}
            ${d.body  ? `<div class="dir-desc">${escapeHtml(d.body)}</div>`   : ''}
          </div>
          ${d.url ? `<span class="dir-arrow" aria-hidden="true">›</span>` : ''}
        </${tag}>`;
      }).join('')}</div>`;
    }

    function renderCta(project) {
      const cta = project.cta || {};
      const url = cta.url || project.url || '';
      const label = cta.label || (url ? 'Перейти' : '');
      if (!url) return `<span class="goto disabled">Ссылка скоро</span>`;
      const host = urlHost(url);
      return `<a class="goto" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" data-goto>${escapeHtml(label)}${host ? ' · ' + escapeHtml(host) : ''}</a>`;
    }

    /* ----- Stack (Apple Wallet model): two states per card ----- */
    // All cards are physically the same size at peek/active (TOP_H);
    // flipped height is измеряется динамически под контент back-стороны
    // and overlap each other — only the top PEEK_H of each non-last card peeks
    // out from under the card below. The last card sits fully visible at the
    // bottom of the stack with its slogan showing. Tap any card to flip it;
    // tap again or the × button to flip back.
    const PEEK_H = 84;   // увеличен чтобы 64-px лого + название умещались в peek-полосе
    const SIBLING_PEEK_H = 15;  // максимально тесный зазор между «сёстрами» — почти впритык
    const TOP_H = 280;
    const FLIPPED_H_MIN = 360;  // нижняя граница flipped-высоты; реальная подстраивается под текст
    const FLIPPED_H_MAX = 720;  // верхняя граница, после которой включается внутренний scroll
    const BACK_PADDING_V = 34;  // 18px top + 16px bottom (.face .back padding)

    /* Меряет натуральную высоту back-стороны конкретной карты. Использует
       offsetHeight для не-scroll элементов и scrollHeight для .scroll
       (он даёт высоту контента, даже если container ограничен по высоте).
       Для карт с каруселью сестёр — берёт МАКСИМУМ по всем страницам, чтобы
       при свайпе ни одна страница не давала внутренний скролл. */
    function measureFlippedHeight(card) {
      const back = card.querySelector('.face.back');
      if (!back) return FLIPPED_H_MIN;
      const variantPages = back.querySelectorAll('.variant-page');
      const measureContainer = (container) => {
        let total = BACK_PADDING_V;
        Array.from(container.children).forEach(child => {
          if (child.classList.contains('scroll')) {
            total += child.scrollHeight;
          } else {
            total += child.offsetHeight;
          }
          const styles = getComputedStyle(child);
          total += parseInt(styles.marginTop || '0', 10) + parseInt(styles.marginBottom || '0', 10);
        });
        return total;
      };
      let total;
      if (variantPages.length) {
        // Берём максимум по всем сёстрам — карта подстраивается под самую
        // длинную страницу, чтобы при свайпе скроллбар не появлялся.
        total = 0;
        variantPages.forEach(page => {
          const h = measureContainer(page);
          if (h > total) total = h;
        });
        const dots = back.querySelector('.variant-dots');
        if (dots) {
          total += dots.offsetHeight;
          const dotsStyles = getComputedStyle(dots);
          total += parseInt(dotsStyles.marginTop || '0', 10) + parseInt(dotsStyles.marginBottom || '0', 10);
        }
      } else {
        total = measureContainer(back);
      }
      // +16 px буфер на subpixel rounding и margin collapse, чтобы
      // контент гарантированно вмещался без 1-2 px оверфлоу.
      return Math.max(FLIPPED_H_MIN, Math.min(FLIPPED_H_MAX, total + 16));
    }

    /* Resolve background to a CSS value, detecting the mode from project.background:
       - empty                    → auto gradient from accent
       - "linear-gradient(...)"   → use as-is (custom gradient)
       - "url(...)"               → use as-is
       - "#hex" / "rgb()" / "hsl()" → solid color
       - "data:..."               → wrap as url()
       - anything else            → treat as image URL (path or absolute) */
    function hexToRgb(hex) {
      let h = String(hex || '').replace('#','');
      if (h.length === 3) h = h.split('').map(c => c+c).join('');
      if (!/^[0-9a-fA-F]{6}$/.test(h)) h = '888888';
      return {
        r: parseInt(h.slice(0,2),16),
        g: parseInt(h.slice(2,4),16),
        b: parseInt(h.slice(4,6),16),
      };
    }
    function resolveBackground(project) {
      const bg = (project.background || '').trim();
      if (!bg) return gradientFor(project.accent || '#888888');
      // Liquid Glass spotlight: dark translucent surface + a radial glow
      // tinted by the project's accent (like the iOS dashboard hero card).
      if (bg === 'glass') {
        const { r, g, b } = hexToRgb(project.accent || '#888888');
        return `radial-gradient(circle at 78% 18%, rgba(${r},${g},${b},0.55) 0%, rgba(${r},${g},${b},0.10) 28%, transparent 55%), rgba(20,20,24,0.78)`;
      }
      if (/^(linear-gradient|radial-gradient|conic-gradient|url\()/i.test(bg)) return bg;
      if (/^(#|rgb\(|hsl\()/i.test(bg)) return bg;
      return `url("${bg.replace(/"/g, '\\"')}")`;
    }

    function textPaletteFor(project) {
      const id = String(project.id || '').toLowerCase();
      let fallback;
      if (id === 'afford') {
        fallback = {
          text: '#573319',
          muted: '#8b5b34',
          overlay: 'linear-gradient(180deg, rgba(87,51,25,0) 0%, rgba(87,51,25,0) 58%, rgba(87,51,25,0.08) 100%)',
          backBg: 'radial-gradient(circle at 50% -12%, #fffaf0 0%, #efd5af 58%, #ddb17e 100%)',
          backText: '#573319',
          backMuted: '#8b5b34',
          backSubtle: '#6f4728',
          backControlBg: 'rgba(87,51,25,0.08)',
          backControlHover: 'rgba(87,51,25,0.14)',
          backDot: 'rgba(87,51,25,0.28)',
          backCtaBg: '#573319',
          backCtaText: '#fff8ed',
        };
      } else if (id === 'p_87fo6th') {
        fallback = {
          text: '#ffffff',
          muted: '#c8d7ff',
          backBg: 'radial-gradient(circle at 84% 0%, rgba(97,116,255,0.48) 0%, transparent 42%), linear-gradient(160deg, #153b9f 0%, #242166 58%, #25133f 100%)',
          backText: '#ffffff',
          backMuted: '#aebdff',
          backSubtle: '#d6dcff',
          backCtaBg: '#ffffff',
          backCtaText: '#151329',
        };
      } else {
        fallback = {
          text: '#fffaff',
          muted: '#b9b0ca',
          backBg: 'radial-gradient(circle at 88% 0%, #34323f 0%, #17151f 34%, #0d0a15 100%)',
          backText: '#fffaff',
          backMuted: '#948aa7',
          backSubtle: '#c2b9d2',
          backCtaBg: '#fffaff',
          backCtaText: '#0a0a0e',
        };
      }

      const custom = (project.palette && typeof project.palette === 'object') ? project.palette : {};
      const palette = {
        ...fallback,
        text: custom.frontText || fallback.text,
        muted: custom.frontMuted || fallback.muted,
        overlay: custom.frontOverlay || fallback.overlay,
        backBg: custom.backBackground || fallback.backBg,
        backText: custom.backText || fallback.backText,
        backMuted: custom.backMuted || fallback.backMuted,
        backSubtle: custom.backSubtle || fallback.backSubtle,
        backCtaBg: custom.backCtaBackground || fallback.backCtaBg,
        backCtaText: custom.backCtaText || fallback.backCtaText,
      };
      const { r, g, b } = hexToRgb(palette.backText);
      palette.backControlBg = custom.backControlBackground || (custom.backText ? `rgba(${r},${g},${b},0.08)` : fallback.backControlBg) || `rgba(${r},${g},${b},0.08)`;
      palette.backControlHover = custom.backControlHover || (custom.backText ? `rgba(${r},${g},${b},0.14)` : fallback.backControlHover) || `rgba(${r},${g},${b},0.14)`;
      palette.backDot = custom.backDot || (custom.backText ? `rgba(${r},${g},${b},0.28)` : fallback.backDot) || `rgba(${r},${g},${b},0.28)`;
      return palette;
    }

    function createCard(project, projectIdx) {
      const card = document.createElement('article');
      card.className = 'card';
      if ((project.background || '').trim() === 'glass') card.classList.add('is-glass');
      card.dataset.idx = projectIdx;

      const textPalette = textPaletteFor(project);
      card.style.setProperty('--card-bg', resolveBackground(project));
      card.style.setProperty('--card-text', textPalette.text);
      card.style.setProperty('--card-muted', textPalette.muted);
      if (textPalette.overlay) card.style.setProperty('--card-overlay', textPalette.overlay);
      if (textPalette.backBg) card.style.setProperty('--card-back-bg', textPalette.backBg);
      if (textPalette.backText) card.style.setProperty('--card-back-text', textPalette.backText);
      if (textPalette.backMuted) card.style.setProperty('--card-back-muted', textPalette.backMuted);
      if (textPalette.backSubtle) card.style.setProperty('--card-back-subtle', textPalette.backSubtle);
      if (textPalette.backControlBg) card.style.setProperty('--card-back-control-bg', textPalette.backControlBg);
      if (textPalette.backControlHover) card.style.setProperty('--card-back-control-hover', textPalette.backControlHover);
      if (textPalette.backDot) card.style.setProperty('--card-back-dot', textPalette.backDot);
      if (textPalette.backCtaBg) card.style.setProperty('--card-back-cta-bg', textPalette.backCtaBg);
      if (textPalette.backCtaText) card.style.setProperty('--card-back-cta-text', textPalette.backCtaText);

      const initials = (project.name || '?').slice(0, 1).toUpperCase();
      const logoInner = project.logo
        ? `<img src="${escapeHtml(project.logo)}" alt="${escapeHtml(project.name)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'initial',textContent:'${initials}'}))" />`
        : `<span class="initial">${initials}</span>`;

      const host = urlHost(project.url);
      const hasUrl = !!project.url;

      card.innerHTML = `
        <div class="card-motion">
        <div class="card-inner">
          <div class="face front">
            <div class="bg-layer"></div>
            <div class="overlay"></div>
            <div class="content">
              <div class="top-row">
                <span class="logo-box">${logoInner}</span>
                <span class="brand-name">${escapeHtml(project.name)}</span>
                ${project.variant ? `<span class="variant">${escapeHtml(project.variant)}</span>` : ''}
                ${project._siblingTotal > 1 ? `<span class="pair-indicator" aria-label="${project._siblingTotal} в группе">${project._siblingTotal}</span>` : ''}
              </div>
              <div class="slogan-wrap">
                ${project.type ? `<p class="type-label">${escapeHtml(project.type)}</p>` : ''}
                <h2 class="slogan">${escapeHtml(project.description || project.name)}</h2>
              </div>
            </div>
          </div>
          <div class="face back">
            ${(project._siblings && project._siblings.length > 1)
              ? renderSiblingCarousel(project)
              : `
                <div class="back-top">
                  <div class="back-title">
                    ${project.type ? `<p class="back-type">${escapeHtml(project.type)}</p>` : ''}
                    <h3>${escapeHtml(project.name)}</h3>
                  </div>
                  <button class="close-btn" type="button" aria-label="Закрыть" data-close>${ICON_CLOSE}</button>
                </div>
                ${project.description ? `<p class="back-tagline">${escapeHtml(project.description)}</p>` : ''}
                <div class="scroll">
                  ${renderSections(project)}
                </div>
                ${renderDirections(project.directions || [])}
                ${renderPills(project.links || [])}
                ${renderCta(project)}
              `}
          </div>
        </div>
        ${(project._siblings && project._siblings.length > 1) ? `
          <button type="button" class="card-nav prev" data-variant-nav="prev" aria-label="Предыдущая сестра" aria-disabled="${(project._siblingIdx || 0) === 0}">${ICON_CHEVRON_LEFT}</button>
          <button type="button" class="card-nav next" data-variant-nav="next" aria-label="Следующая сестра" aria-disabled="${(project._siblingIdx || 0) === project._siblings.length - 1}">${ICON_CHEVRON_RIGHT}</button>
        ` : ''}
        </div>
      `;

      bindPhysicalMotion(card);

      return card;
    }

    function initStack(projects) {
      const stack = document.getElementById('stack');
      stack.innerHTML = '';

      // Skip cards flagged as hidden (live in the admin archive).
      projects = (projects || []).filter(p => !p.hidden);

      // Detect sibling groups — cards with the same `group` value are
      // "attached" peers (e.g. CineShift B2C + CineShift B2B). For each
      // member attach _siblingIdx / _siblingTotal (for the digit pill on
      // the front) and _siblings (full array, used to render a carousel
      // on the back so tapping any sister opens a swipeable view of all).
      const groups = {};
      projects.forEach(p => {
        if (!p.group) return;
        (groups[p.group] = groups[p.group] || []).push(p);
      });
      Object.values(groups).forEach(arr => {
        if (arr.length < 2) return;
        arr.forEach((p, i) => {
          p._siblingIdx = i;
          p._siblingTotal = arr.length;
          p._siblings = arr;
        });
      });

      // Карта-«представитель» группы сестёр — это первая сестра.
      // Возвращает индекс первой сестры группы для любого проекта,
      // или сам индекс, если проект одиночный.
      function leaderIdx(idx) {
        const p = projects[idx];
        if (!p._siblings || p._siblings.length < 2) return idx;
        return projects.indexOf(p._siblings[0]);
      }

      // Трёхуровневая модель: peek → active → flipped.
      //   expandedIdx: какая карта поднята из стопки (active или flipped).
      //   -1 = ни одна не открыта.
      //   isFlipped: true только когда expandedIdx-карта перевёрнута.
      let expandedIdx = -1;
      let isFlipped = false;

      const cards = projects.map((p, i) => createCard(p, i));
      cards.forEach(c => stack.appendChild(c));

      function apply() {
        const lastIdx = cards.length - 1;
        let y = 0;
        cards.forEach((card, idx) => {
          const project = projects[idx];

          // Сёстры-группа: если первая сестра группы развёрнута (active или
          // flipped), все остальные сёстры этой группы полностью прячутся
          // из стопки. Карусель внутри первой сестры показывает их
          // контент через свайп/стрелки.
          const isSiblingSecondary =
            project._siblings && project._siblings.length > 1 &&
            project._siblingIdx > 0;
          const groupLeader = isSiblingSecondary ? leaderIdx(idx) : -1;
          const groupOpen = isSiblingSecondary && expandedIdx === groupLeader;
          if (groupOpen) {
            card.style.display = 'none';
            return;
          }
          card.style.display = '';

          const isLast = idx === lastIdx;
          const isExplicit = expandedIdx === idx;
          const isActive = isExplicit || (isLast && expandedIdx === -1);
          const cardIsFlipped = isExplicit && isFlipped;
          // Для flipped — динамическая высота под текст контента.
          // Для peek/active — фиксированная TOP_H.
          const cardH = cardIsFlipped ? measureFlippedHeight(card) : TOP_H;

          card.style.top = y + 'px';
          card.style.height = cardH + 'px';
          card.style.zIndex = String(isExplicit ? 100 : (10 + idx));
          card.classList.toggle('is-flipped', cardIsFlipped);
          card.classList.toggle('is-active', isActive && !cardIsFlipped);
          card.classList.toggle('is-extracted', isExplicit);
          if ((!isActive || cardIsFlipped) && typeof card._resetPhysicalMotion === 'function') card._resetPhysicalMotion();
          card.setAttribute('aria-hidden', 'false');

          // Layout advance:
          //  - active/flipped/last → full height (fully visible)
          //  - else if next card is the same sibling group → tighter peek
          //    (visually "attached" pair, gap is SIBLING_PEEK_H)
          //  - else regular peek (PEEK_H)
          const nextProj = projects[idx + 1];
          const isSiblingPair =
            !isActive && !isLast &&
            projects[idx].group && nextProj &&
            projects[idx].group === nextProj.group;
          if (isActive || isLast) {
            y += cardH;
          } else if (isSiblingPair) {
            y += SIBLING_PEEK_H;
          } else {
            y += PEEK_H;
          }
        });
        stack.style.height = y + 'px';
      }

      // Helper: switch active variant in a card's carousel
      function setVariant(card, targetIdx) {
        const track = card.querySelector('.variant-track');
        if (!track) return;
        const pages = track.querySelectorAll('.variant-page');
        const clamped = Math.max(0, Math.min(pages.length - 1, targetIdx));
        track.dataset.current = clamped;
        track.style.transform = `translateX(-${clamped * 100}%)`;
        card.querySelectorAll('.variant-dot').forEach((d, i) => {
          d.classList.toggle('active', i === clamped);
        });
        // Обновить aria-disabled на всех стрелках (.card-nav снаружи карты
        // и .variant-nav внутри карусели, если она ещё используется)
        card.querySelectorAll('[data-variant-nav="prev"]').forEach(b => b.setAttribute('aria-disabled', String(clamped === 0)));
        card.querySelectorAll('[data-variant-nav="next"]').forEach(b => b.setAttribute('aria-disabled', String(clamped === pages.length - 1)));
      }

      cards.forEach((card) => {
        const idx = +card.dataset.idx;

        // Прямые обработчики на навигации карусели. Регистрируем
        // через mousedown + click — на случай если click где-то по
        // пути съедается, mousedown точно дойдёт. Capture phase + куча
        // stop'ов и preventDefault.
        card.querySelectorAll('[data-variant-nav]').forEach(navBtn => {
          const navHandler = (ev) => {
            ev.stopImmediatePropagation();
            ev.stopPropagation();
            ev.preventDefault();
            if (navBtn.getAttribute('aria-disabled') === 'true') return;
            const trk = card.querySelector('.variant-track');
            const curr = +(trk && trk.dataset.current) || 0;
            const target = navBtn.dataset.variantNav === 'next' ? curr + 1 : curr - 1;
            setVariant(card, target);
          };
          navBtn.addEventListener('click', navHandler, true);
          navBtn.addEventListener('mousedown', (ev) => {
            ev.stopImmediatePropagation();
            ev.stopPropagation();
          }, true);
        });
        card.querySelectorAll('.variant-dot').forEach(dotBtn => {
          dotBtn.addEventListener('click', (ev) => {
            ev.stopImmediatePropagation();
            ev.stopPropagation();
            ev.preventDefault();
            setVariant(card, +dotBtn.dataset.variantIdx);
          }, true);
        });

        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-goto]')) return;
          // Страховка — если по какой-то причине прямой listener
          // не сработал, тут тоже отлавливаем nav/dot и выходим.
          if (e.target.closest('[data-variant-nav]')) return;
          if (e.target.closest('.variant-dot')) return;
          if (e.target.closest('[data-close]')) {
            // Закрыть → стопка
            expandedIdx = -1;
            isFlipped = false;
            apply();
            return;
          }
          // Трёхуровневый цикл: peek → active → flipped → peek.
          // Клик по ЛЮБОЙ из сестёр в группе раскрывает первую сестру.
          // Карусель всегда стартует с первой страницы — независимо от
          // того, по какой сестре в стопке кликнули. Пользователь может
          // перейти на вторую сестру через стрелку / точку / свайп.
          const effIdx = leaderIdx(idx);
          const lastIdx = cards.length - 1;
          const isExplicit = (expandedIdx === effIdx);
          const isActiveNow =
            isExplicit || (effIdx === lastIdx && expandedIdx === -1);
          if (!isActiveNow) {
            // Peek → active. Гарантируем стартовую страницу = 0.
            expandedIdx = effIdx;
            isFlipped = false;
            setVariant(cards[effIdx], 0);
          } else if (!isFlipped) {
            // Active → flipped
            expandedIdx = effIdx;
            isFlipped = true;
          } else {
            // Flipped → peek (стопка). При следующем открытии — снова с
            // первой страницы (мы сбрасываем при peek→active).
            expandedIdx = -1;
            isFlipped = false;
          }
          apply();
        });

        // Horizontal swipe on the variant track
        const track = card.querySelector('.variant-track');
        if (track) {
          let touchStartX = 0;
          let touchStartY = 0;
          let touching = false;
          track.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touching = true;
          }, { passive: true });
          track.addEventListener('touchend', e => {
            if (!touching) return;
            touching = false;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            // Only treat as swipe if horizontal dominates and big enough
            if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
              e.stopPropagation();
              const curr = +track.dataset.current || 0;
              setVariant(card, dx < 0 ? curr + 1 : curr - 1);
            }
          }, { passive: true });
        }
      });

      // Lay out once with transitions off, then enable them so first paint
      // doesn't animate every card from its CSS default into place.
      apply();
      requestAnimationFrame(() => {
        cards.forEach(c => c.classList.add('ready'));
      });
    }

    /* ----- Starfield ----- */
    function generateStarfield() {
      const field = document.getElementById('starfield');
      if (!field) return;
      const frag = document.createDocumentFragment();
      const COUNT = 140;

      function setDrift(el, big) {
        // Random offset in pixels. Bigger stars allowed bigger drift, giving
        // a subtle parallax effect (closer stars move more).
        const range = big ? 36 : 22;
        const r = () => (Math.random() * 2 - 1) * range;
        el.style.setProperty('--dx0', r().toFixed(1) + 'px');
        el.style.setProperty('--dy0', r().toFixed(1) + 'px');
        el.style.setProperty('--dx1', r().toFixed(1) + 'px');
        el.style.setProperty('--dy1', r().toFixed(1) + 'px');
        el.style.setProperty('--drift-d', (28 + Math.random() * 40).toFixed(1) + 's');
        el.style.setProperty('--drift-delay', (Math.random() * 20).toFixed(1) + 's');
      }

      for (let i = 0; i < COUNT; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const r = Math.random();
        // Slightly bigger overall: dust 1.5 → highlights up to 3px
        const size = r < 0.62 ? 1.5 : (r < 0.85 ? 2 : (r < 0.96 ? 2.5 : 3));
        const op = 0.25 + Math.random() * 0.65;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.top = (Math.random() * 100).toFixed(2) + '%';
        s.style.opacity = op.toFixed(2);
        if (size >= 2) {
          s.style.boxShadow = `0 0 ${size * 2.2}px ${size * 0.7}px rgba(255,255,255,${(op * 0.5).toFixed(2)})`;
        }
        setDrift(s, size >= 2);
        // ~45% also pulse — pairs nicely with drift (different property, no conflict)
        if (Math.random() < 0.45) {
          s.classList.add('tw');
          s.style.setProperty('--d', (2.6 + Math.random() * 3.4).toFixed(2) + 's');
          s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
          s.style.setProperty('--max', op.toFixed(2));
          s.style.setProperty('--min', (op * 0.20).toFixed(2));
        }
        frag.appendChild(s);
      }

      // 3 feature "guide stars" — bigger, brighter, longer drift, always pulse
      for (let i = 0; i < 3; i++) {
        const s = document.createElement('div');
        s.className = 'star tw';
        const size = (3.5 + Math.random() * 1.5).toFixed(2);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (10 + Math.random() * 80).toFixed(2) + '%';
        s.style.top  = (5 + Math.random() * 85).toFixed(2) + '%';
        s.style.opacity = '0.90';
        s.style.boxShadow = `0 0 ${size * 3}px ${size * 1.4}px rgba(255,255,255,0.45)`;
        setDrift(s, true);
        s.style.setProperty('--d', (3 + Math.random() * 2).toFixed(2) + 's');
        s.style.setProperty('--delay', (Math.random() * 3).toFixed(2) + 's');
        s.style.setProperty('--max', '0.95');
        s.style.setProperty('--min', '0.45');
        frag.appendChild(s);
      }

      field.appendChild(frag);
    }

    /* ----- Cosmic mode (пасхалка футера) -----
       Тап по бренду «Vozhakin Group» в подвале прячет весь контент на
       30 секунд. Виден звёздный фон и периодически летят падающие звёзды.
       Любой клик/тап во время режима выходит из него досрочно. */
    function setupCosmicMode() {
      const trigger = document.getElementById('cosmic-trigger');
      if (!trigger) return;
      let active = false;
      let meteorTimer = null;
      let exitTimer = null;

      // Классический звездопад: метеоры идут параллельно из верхнего
       // левого в правый нижний, как реальный поток виден с земли (когда
       // радиант далеко за пределами экрана, метеоры выглядят почти
       // параллельными). Угол ~28-34° от горизонтали.
      function spawnMeteor() {
        const m = document.createElement('div');
        m.className = 'meteor';
        // Цветовое распределение: 28% белый, 28% синий, 16% зелёный,
        // 16% жёлтый, 8% фиолетовый, 4% огненный (fireball — крупный, медленный).
        const r = Math.random();
        const isFireball = r < 0.04;
        if (isFireball) {
          m.classList.add('fireball');
        } else {
          let color;
          if      (r < 0.32) color = 'white';
          else if (r < 0.60) color = 'blue';
          else if (r < 0.76) color = 'green';
          else if (r < 0.92) color = 'yellow';
          else               color = 'purple';
          m.classList.add('color-' + color);
        }

        const W = window.innerWidth;
        const H = window.innerHeight;
        const len = isFireball ? (280 + Math.random() * 140) : (180 + Math.random() * 140);
        m.style.setProperty('--len', len + 'px');

        // Точка появления — случайно по краю «верх-лево» зоны входа:
        // 60% время появляется на верхней границе (с уходом за левый край),
        // 40% — на левой границе. Зона входа покрывает левую половину
        // верха и верхнюю треть левой стороны.
        let headStartX, headStartY;
        if (Math.random() < 0.6) {
          // Сверху: x от -150 до 60% ширины
          headStartX = -150 + Math.random() * (W * 0.6 + 150);
          headStartY = -80 - Math.random() * 100;
        } else {
          // Слева: y от -50 до 40% высоты
          headStartX = -100 - Math.random() * 80;
          headStartY = -50 + Math.random() * (H * 0.4);
        }
        m.style.left = (headStartX - len) + 'px';
        m.style.top  = (headStartY - 1) + 'px';

        // Угол наклона streak'а — ~28-34° от горизонтали
        // (все метеоры идут почти параллельно, лёгкий разброс).
        const angleDeg = 28 + Math.random() * 6;
        const theta = angleDeg * Math.PI / 180;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);
        m.style.setProperty('--angle', angleDeg.toFixed(2) + 'deg');

        // Полёт через весь экран + запас (1.5-1.8 диагонали)
        const flyDist = (1.5 + Math.random() * 0.3) *
          Math.sqrt(W * W + H * H);
        m.style.setProperty('--dx', (cosT * flyDist).toFixed(0) + 'px');
        m.style.setProperty('--dy', (sinT * flyDist).toFixed(0) + 'px');

        // Длительность медленнее — у пользователя есть время рассмотреть
        const duration = isFireball ? (3.5 + Math.random() * 1.5) : (2.4 + Math.random() * 1.2);
        m.style.animationDuration = duration.toFixed(2) + 's';

        document.body.appendChild(m);
        setTimeout(() => m.remove(), (duration + 0.4) * 1000);
      }

      function enter() {
        if (active) return;
        active = true;
        // Запрашиваем настоящий полноэкранный режим — браузерный хром
        // (URL-бар, вкладки) уходит, остаётся только космос.
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        let fsAttempted = false;
        if (req) {
          try { req.call(el).catch(() => {}); fsAttempted = true; } catch (_) {}
        }
        // Мобильный fallback: если Fullscreen API не сработал (iOS Safari),
        // пробуем спрятать URL-бар через программный scroll.
        // На iOS scroll вниз минимизирует URL-бар.
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
          // Дать странице scroll-room, прокрутить, потом залочить
          const tryHideUrlBar = () => {
            // Только если ещё не в fullscreen
            if (document.fullscreenElement || document.webkitFullscreenElement) return;
            const originalScrollY = window.scrollY;
            window.scrollTo(0, Math.max(1, originalScrollY));
            // Иногда нужен ещё один тик после layout
            setTimeout(() => {
              if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                window.scrollTo(0, Math.max(1, window.scrollY));
              }
            }, 50);
          };
          tryHideUrlBar();
        }
        document.body.classList.add('cosmic-mode');
        // Лочим скролл чуть позже, чтобы URL-bar успел спрятаться
        setTimeout(() => {
          document.documentElement.classList.add('cosmic-locked');
        }, isMobile ? 120 : 0);
        // Стартовый залп — 3 метеора каскадом, не перегружая глаз
        for (let k = 0; k < 3; k++) setTimeout(spawnMeteor, k * 220);
        // Более редкий, спокойный поток: ~раз в 1.3 сек + 15% шанс
        // двойного-тройного всплеска
        meteorTimer = setInterval(() => {
          const burstSize = Math.random() < 0.15 ? (2 + Math.floor(Math.random() * 2)) : 1;
          for (let k = 0; k < burstSize; k++) {
            setTimeout(spawnMeteor, k * (180 + Math.random() * 200));
          }
        }, 1300);
        exitTimer = setTimeout(exit, 30000);
        setTimeout(() => {
          window.addEventListener('click', exit, { once: true, capture: true });
          window.addEventListener('touchstart', exit, { once: true, capture: true });
        }, 700);
      }

      function exit() {
        if (!active) return;
        active = false;
        // Сначала включаем revealing-класс — он задаёт transition-delay'ы
        // для поэтапного появления, ПОТОМ снимаем cosmic-mode (тогда
        // transitions с этими delays начнут отыгрывать в нужном порядке).
        document.body.classList.add('cosmic-revealing');
        // Принудительный reflow, чтобы браузер применил .cosmic-revealing
        // до того как сменится opacity (иначе обе смены могут смерджиться).
        void document.body.offsetHeight;
        document.body.classList.remove('cosmic-mode');
        clearInterval(meteorTimer);
        clearTimeout(exitTimer);
        meteorTimer = null;
        exitTimer = null;
        // Снимаем revealing после полного завершения волны
        // (max delay 620ms + transition 800ms + buffer 200ms)
        // Выходим из fullscreen, если был активен
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (exitFn) { try { exitFn.call(document).catch(() => {}); } catch (_) {} }
        }
        setTimeout(() => {
          document.body.classList.remove('cosmic-revealing');
          document.documentElement.classList.remove('cosmic-locked');
        }, 1700);
      }

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        active ? exit() : enter();
      });

      // Если пользователь вышел из fullscreen через ESC — синхронизируем
      // и закрываем cosmic-mode тоже (иначе UI остался бы скрыт).
      const onFsChange = () => {
        if (active && !document.fullscreenElement && !document.webkitFullscreenElement) {
          exit();
        }
      };
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);
    }

    /* ----- Boot ----- */
    (async () => {
      generateStarfield();
      const data = await loadData();
      applyMotionSettings(data.motion || {});
      renderProfile(data.profile || {});
      initStack(data.projects || []);
      renderContacts(data.contacts || []);
      renderFooter(data.footer || {});
      setupCosmicMode();
    })();
  </script>
</body>
</html>
