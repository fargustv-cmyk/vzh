<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>vozhakin.group</title>
  <meta name="description" content="Yasha Vozhakin — Founder by Vozhakin Group" />
  <meta property="og:title" content="vozhakin.group" />
  <meta property="og:description" content="Yasha Vozhakin — Founder by Vozhakin Group" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vozhakin.group" />
  <meta name="theme-color" content="#020207" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020207;
      --bg-tint: #080712;
      --text: #f8f5ff;
      --text-muted: #b7afc7;
      --text-subtle: rgba(183,175,199,0.54);
      --glass-bg: rgba(137,113,194,0.08);
      --glass-highlight: rgba(229,220,255,0.20);
      --hairline: rgba(201,190,226,0.13);
      --card-h: 280px;
      /* legacy aliases */
      --muted: var(--text-muted);
      --pill: var(--glass-bg);
      --pill-border: rgba(255,255,255,0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }
    html { scrollbar-gutter: stable; }
    body {
      min-height: 100vh;
      /* Дополнительные 28px сверху, чтобы профиль не «прилипал» к шапке
         браузера. safe-area-inset-top на iPhone добавит сверху своё значение. */
      padding: calc(env(safe-area-inset-top, 0px) + 56px) 16px env(safe-area-inset-bottom, 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      position: relative;
    }

    /* === Cosmic background === */
    /* Fixed full-screen layer with a deep nebula wash + generated starfield.
       Sits behind everything (z-index: -1) and doesn't scroll. */
    .starfield {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse 62% 48% at 74% 14%, rgba(170,155,255,0.16) 0%, transparent 58%),
        radial-gradient(ellipse 68% 55% at 26% 46%, rgba(83,62,147,0.12) 0%, transparent 62%),
        radial-gradient(ellipse 54% 46% at 82% 82%, rgba(38,53,125,0.10) 0%, transparent 66%),
        linear-gradient(148deg, #020207 0%, #080712 56%, #020205 100%);
    }
    /* @property registers the drift offsets as <length>s so the browser can
       smoothly interpolate between them. Without this, custom properties are
       treated as discrete strings inside transform() — the result looks like
       the stars teleport instead of drifting. */
    @property --dx0 { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --dy0 { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --dx1 { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --dy1 { syntax: '<length>'; inherits: false; initial-value: 0px; }

    .starfield .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      /* fill-mode both → during the delay the 0% keyframe applies, so the
         star starts at its drift origin instead of snapping to it. */
      animation: drift var(--drift-d, 40s) ease-in-out var(--drift-delay, 0s) infinite both;
    }
    .starfield .star.tw {
      animation:
        drift var(--drift-d, 40s) ease-in-out var(--drift-delay, 0s) infinite both,
        twinkle var(--d, 4s) ease-in-out var(--delay, 0s) infinite both;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(var(--dx0), var(--dy0), 0); }
      50%      { transform: translate3d(var(--dx1), var(--dy1), 0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--max, 0.8); }
      50%      { opacity: var(--min, 0.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .starfield .star { animation: none; }
    }

    .wallet {
      width: 100%;
      max-width: 420px;
    }

    /* Wrapper around profile + actions. On mobile it's transparent for
       layout (children flow into .wallet's flex column). On desktop it
       becomes a real block + position anchor for the absolutely-placed
       actions button. */
    .left-col { display: contents; }
    /* On mobile, ensure the natural order is preserved: profile, stack,
       actions, footer — even though .left-col wraps profile+actions. */
    .actions { order: 1; }
    .footer  { order: 2; }

    /* === Profile — glass plate that flips to "About me" === */
    .profile {
      width: 100%;
      max-width: 420px;
      padding: 12px 0 22px;
      perspective: 1600px;
    }
    .profile-card {
      --state-y: 0px;
      --state-z: 0px;
      --state-scale: 1;
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 22px;
      cursor: pointer;
      perspective: 1600px;
      transform-style: preserve-3d;
      transform:
        translate3d(0, var(--state-y), var(--state-z))
        scale(var(--state-scale));
      transition:
        height var(--motion-spring-ms, 620ms) cubic-bezier(.22,.9,.25,1),
        transform var(--motion-spring-ms, 620ms) cubic-bezier(.22,1.18,.36,1),
        filter 180ms ease;
      will-change: height, transform;
    }
    .profile-card.is-flipped {
      height: 380px;
      --state-y: var(--motion-profile-y, -9px);
      --state-z: var(--motion-profile-z, 22px);
      --state-scale: var(--motion-profile-scale, 1.008);
    }
    .profile-card .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform var(--motion-flip-ms, 760ms) cubic-bezier(.2,.78,.22,1);
      border-radius: inherit;
      transform-origin: 52% 50%;
    }
    .profile-card.is-flipped .card-inner { transform: rotateY(-180deg); }
    .profile-card .face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      color: var(--text);
      overflow: hidden;
      /* Максимум стекла: alpha 0.22 (звёзды видны напрямую), blur 80px и
         saturate 210% — материал ощущается тоньше плёнки.
         Прежние параметры (на случай если этот вариант слишком прозрачен):
           background: rgba(20,20,24,0.32);
           backdrop-filter: blur(60px) saturate(200%);
           inset top highlight: rgba(255,255,255,0.30); */
      background:
        radial-gradient(140% 90% at 30% 0%, rgba(255,255,255,0.12) 0%, transparent 55%),
        rgba(20,20,24,0.22);
      -webkit-backdrop-filter: blur(80px) saturate(210%);
      backdrop-filter: blur(80px) saturate(210%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.34),
        inset 0 0 0 0.5px rgba(255,255,255,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.10),
        0 1px 2px rgba(0,0,0,0.16),
        0 14px 30px rgba(0,0,0,0.38);
    }
    .profile-card .face.front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      gap: 14px;
    }
    .profile-card .face.front img.avatar {
      width: 96px; height: 96px;
      border-radius: 24px;
      object-fit: cover;
      /* object-position 50% 30% сдвигает видимое окно изображения вверх по
         кадру — то есть в squircle-контейнере видна верхняя часть фото,
         где обычно голова. По умолчанию center 50% обрезал голову сверху. */
      object-position: 50% 30%;
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.20),
        0 0 0 3px rgba(255,255,255,0.04),
        0 8px 22px rgba(0,0,0,0.50);
    }
    .profile-card .face.front .name-block { text-align: center; }
    .profile-card .face.front h1 {
      font-size: 17px;
      font-weight: 500;
      margin: 0 0 2px;
      letter-spacing: -0.015em;
    }
    .profile-card .face.front p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.005em;
    }
    .profile-card .face.back {
      transform: rotateY(-180deg);
      display: flex;
      flex-direction: column;
      padding: 18px 20px 16px;
    }
    /* Manifesto inline on the FRONT — hidden on mobile, shown on desktop */
    .profile-card .face.front .front-manifesto { display: none; }

    /* === Desktop layout (≥ 960px): two columns =========================== */
    @media (min-width: 960px) {
      body {
        padding: calc(env(safe-area-inset-top, 0px) + 88px) 32px env(safe-area-inset-bottom, 48px);
      }
      .wallet {
        max-width: 1080px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        grid-template-areas:
          "leftcol stack"
          "footer  footer";
        column-gap: 56px;
        row-gap: 24px;
        align-items: start;
      }
      /* .left-col becomes a real block on desktop — анкер для абсолютной
         кнопки контакта. profile-card сидит в потоке, actions выходит из
         потока и фиксируется по top:484, не реагируя на флипы. */
      .left-col {
        display: block;
        grid-area: leftcol;
        position: relative;
        min-height: 460px;       /* high enough to cover profile-card in flipped state */
      }
      .profile  { max-width: none; padding: 0; margin: 0; }
      .stack    { grid-area: stack;   margin: 0; order: 0; }
      .footer   { grid-area: footer;  margin-top: 24px; order: 0; }
      /* Actions фиксированно ниже максимальной высоты profile-card во
         флипнутом состоянии (460px) + 24px gap. Никакие флипы не сдвигают. */
      .actions {
        position: absolute;
        top: 484px;
        left: 0;
        margin: 0;
        justify-content: flex-start;
        order: 0;
      }

      /* Profile card grows on desktop and shows the manifesto inline. */
      .profile-card { height: 360px; }
      .profile-card.is-flipped { height: 460px; }
      .profile-card .face.front {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        text-align: left;
        padding: 28px 32px;
        gap: 14px;
      }
      .profile-card .face.front img.avatar { width: 128px; height: 128px; border-radius: 28px; }
      .profile-card .face.front .name-block { text-align: left; }
      .profile-card .face.front .name-block h1 {
        font-size: 24px;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .profile-card .face.front .name-block p {
        font-size: 14px;
      }
      .profile-card .face.front .front-manifesto {
        display: block;
        font-size: 14px;
        line-height: 1.55;
        color: rgba(255,255,255,0.74);
        margin: 8px 0 0;
        letter-spacing: -0.005em;
      }
    }

    /* Stack */
    .stack {
      position: relative;
      width: 100%;
      perspective: 1400px;
      transform-style: preserve-3d;
      /* Height is set by JS based on TOP_H + (N-1) * PEEK_H so the layout
         is identical no matter which card is active — no scrolling on tap. */
      margin: 8px 0 24px;
    }

    /* === Card — Cupertino === */
    /* iOS spring: cubic-bezier(.32,.72,0,1) — used everywhere for parity. */
    .card {
      --state-y: 0px;
      --state-scale: 1;
      position: absolute;
      left: 0; right: 0;
      height: var(--card-h);
      border-radius: 22px;
      overflow: visible;
      cursor: pointer;
      perspective: 1600px;
      transform-style: preserve-3d;
      will-change: top, height;
    }
    /* Transitions only after first layout pass. */
    .card.ready {
      transition:
        top var(--motion-spring-ms, 620ms) cubic-bezier(.22,.9,.25,1),
        height var(--motion-spring-ms, 620ms) cubic-bezier(.22,.9,.25,1);
    }
    /* The stack geometry and hit area stay fixed on .card. This visual layer
       moves only after a deliberate click; cursor movement changes light only. */
    .card-motion {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transform-style: preserve-3d;
      transform:
        translateY(var(--state-y))
        scale(var(--state-scale));
      transform-origin: 50% 78%;
      transition:
        transform var(--motion-spring-ms, 620ms) cubic-bezier(.22,1.18,.36,1),
        filter 180ms ease;
      will-change: transform;
    }
    .card.is-extracted {
      --state-y: var(--motion-extract-y, -16px);
      --state-scale: var(--motion-extract-scale, 1.018);
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform var(--motion-flip-ms, 760ms) cubic-bezier(.2,.78,.22,1);
      border-radius: inherit;
      transform-origin: 52% 50%;
    }
    /* Mirror flip — card rotates in the opposite direction so it feels like
       the right edge swings forward instead of the left. */
    .card.is-flipped .card-inner { transform: rotateY(-180deg); }

    .face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* Явный transform на каждой стороне — гарантирует участие в 3D-контексте
         card-inner и корректную работу backface-visibility. Без явного transform
         на front в некоторых браузерах (Safari, старый Firefox) обратная сторона
         «протекает» через лицевую — видны зеркальные логотип/название. */
      transform: translateZ(0);
      isolation: isolate;
      color: var(--card-text, #fffaff);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.24),
        inset 0 0 0 0.5px rgba(255,255,255,0.04),
        0 1px 2px rgba(0,0,0,0.20),
        0 10px 22px rgba(0,0,0,0.30);
      transition: box-shadow 520ms cubic-bezier(.32,.72,0,1);
    }
    /* Front с явной нулевой ротацией = тот же 3D-контекст, что и back.
       Без этого front может оказаться в плоском контексте, и при повороте
       card-inner на -180° front покажется зеркально. */
    .face.front {
      transform: rotateY(0deg) translateZ(.5px);
      background: var(--card-bg, linear-gradient(165deg, #555, #222));
      background-size: cover;
      background-position: center;
    }
    /* Active = карта поднята из стопки лицом вверх (перед переворотом).
       Тень чуть глубже, чем у peek, но мягче, чем у flipped — даёт визуально
       понять, что карта «выбрана» и следующий тап её перевернёт. */
    .card.is-active .face {
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.26),
        inset 0 0 0 0.5px rgba(255,255,255,0.05),
        0 2px 4px rgba(0,0,0,0.24),
        0 20px 44px rgba(0,0,0,0.42);
    }
    .card.is-flipped .face {
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.28),
        inset 0 0 0 0.5px rgba(255,255,255,0.05),
        0 2px 4px rgba(0,0,0,0.30),
        0 30px 64px rgba(0,0,0,0.55);
    }
    /* No square-bottom hack needed: the next card sits on top of each peek
       card and naturally hides its rounded bottom corners. */

    /* Glass-spotlight mode: card surface is translucent so the starfield and
       nebula behind it blur through, with a radial accent-coloured glow in
       the upper-right (like the iOS dashboard hero card). */
    .card.is-glass .face .bg-layer {
      -webkit-backdrop-filter: blur(34px) saturate(160%);
      backdrop-filter: blur(34px) saturate(160%);
    }
    /* In glass mode the bottom scrim would muddy the radial glow, so hide it. */
    .card.is-glass .face .overlay { opacity: 0; }
    /* Soft specular still helps glass feel, but lighter so the accent glow stays the hero. */
    .card.is-glass .face::after {
      background:
        radial-gradient(150% 80% at 50% -30%, rgba(255,255,255,0.10) 0%, transparent 55%);
    }
    .face .bg-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--card-bg, linear-gradient(165deg, #555, #222));
      background-size: cover;
      background-position: center;
      z-index: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* Specular sheen — always on. Mimics polished glass catching overhead
       light: a radial highlight near the top and a soft white wash on the
       upper 22% of the card. */
    .face::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(150% 80% at 50% -30%, rgba(255,255,255,0.20) 0%, transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.00) 22%);
      pointer-events: none;
      z-index: 1;
    }
    /* Cursor-driven reflection. It stays invisible until pointer tracking is
       active, then travels across the material instead of moving the content. */
    .face::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--glare-x, 50%) var(--glare-y, 35%),
        rgba(255,255,255,.62) 0%,
        rgba(255,255,255,.16) 17%,
        transparent 46%
      );
      mix-blend-mode: soft-light;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: opacity 220ms ease;
    }
    .card.is-pointer-tracking .face::before,
    .profile-card.is-pointer-tracking .face::before {
      opacity: var(--motion-glare-opacity, .22);
    }

    .face .overlay {
      /* Vignette at bottom anchors the slogan on the last card; on peek cards
         this area is hidden under the next card, on flipped cards it's
         rotated out of view — so always-on is fine. */
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--card-overlay,
        linear-gradient(180deg,
          rgba(0,0,0,0.00) 0%,
          rgba(0,0,0,0.00) 55%,
          rgba(0,0,0,0.35) 100%));
      pointer-events: none;
      z-index: 1;
    }

    .face .content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 18px 18px;
    }
    .back {
      transform: rotateY(-180deg) translateZ(.5px);
      background: var(--card-back-bg,
        radial-gradient(120% 80% at 24% 0%, rgba(151,126,213,0.18) 0%, transparent 55%),
        linear-gradient(160deg, #211e2b 0%, #0d0a15 72%, #08060e 100%));
      color: var(--card-back-text, var(--text));
      padding: 18px 18px 16px;
    }

    /* Top row — same anchor in every state */
    .top-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
    }
    .logo-box {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: rgba(255,255,255,0.10);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.32),
        inset 0 0 0 0.5px rgba(255,255,255,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.12);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
    }
    .logo-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      padding: 0;
    }
    .logo-box .initial {
      font-size: 26px; font-weight: 500; color: var(--card-text, #fffaff);
      letter-spacing: -0.01em;
    }
    .brand-name {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    /* Variant — small label after the brand name, e.g. "CineShift · для физлиц".
       Lets sister cards in the stack share logo + colour but stay readable
       at peek size. */
    .variant {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--card-muted, rgba(255,255,255,0.55));
      white-space: nowrap;
      padding-left: 12px;
      position: relative;
      flex-shrink: 0;
      max-width: 50%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .variant::before {
      content: '·';
      position: absolute;
      left: 3px;
      top: 50%;
      transform: translateY(-55%);
      color: var(--card-muted, rgba(255,255,255,0.35));
      opacity: 0.7;
      font-size: 14px;
      line-height: 1;
    }
    /* Pair indicator — цифра в углу показывает сколько всего сестёр в группе.
       Например «2» = эта карточка одна из двух связанных. */
    .pair-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      margin-left: auto;
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--card-text, rgba(255,255,255,0.96));
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.24),
        inset 0 0 0 0.5px rgba(255,255,255,0.08);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }

    /* Bottom block: always visible on the front face. On peek cards the
       next card covers it; on flipped cards the front is rotated away. */
    .slogan-wrap {
      margin-top: auto;
    }
    .type-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin: 0 0 5px;
      color: var(--card-muted, rgba(255,255,255,0.68));
    }
    .slogan {
      font-size: 23px;
      font-weight: 500;
      margin: 0;
      line-height: 1.10;
      letter-spacing: -0.022em;
    }

    /* === Back side === */
    .back {
      display: flex;
      flex-direction: column;
    }
    .back .back-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 6px;
      flex-shrink: 0;
      gap: 12px;
    }
    .back .back-title { min-width: 0; flex: 1; }
    .back .back-type {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--card-back-muted, #948aa7);
      margin: 0 0 3px;
    }
    .back h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.015em;
    }
    /* Маленький значок-вариант после названия (e.g. «CineShift для физлиц»).
       Сообщает, какая из сестёр сейчас открыта в карусели. */
    .back .back-variant-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 9px 2px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--card-back-subtle, #b7afc7);
      background: var(--card-back-control-bg, rgba(255,255,255,0.08));
      border-radius: 999px;
      vertical-align: middle;
      line-height: 1;
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.14);
    }
    .back .back-tagline {
      font-size: 14px;
      font-weight: 400;
      color: var(--card-back-subtle, #b7afc7);
      margin: 0 0 14px;
      letter-spacing: -0.005em;
      line-height: 1.35;
      flex-shrink: 0;
    }
    .back .close-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--card-back-control-bg, rgba(255,255,255,0.08));
      border: none;
      color: var(--card-back-text, rgba(255,255,255,0.94));
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      line-height: 1;
      font-family: inherit;
      /* Glass circle: bright top highlight + hairline */
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 0 0 0.5px rgba(255,255,255,0.08);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      transition: background 160ms ease;
    }
    .back .close-btn:hover { background: var(--card-back-control-hover, rgba(255,255,255,0.14)); }

    .back .scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      margin-right: -4px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    /* Скроллбар спрятан полностью — карта подстраивается по высоте под
       контент через JS-измерение. Если из-за subpixel rounding появится
       микро-оверфлоу, тонкая вертикальная полоска не вылезет на back-сторону. */
    .back .scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .back .scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }

    .back .section { margin-bottom: 14px; }
    .back .section:last-child { margin-bottom: 0; }
    .back .section h4 {
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--card-back-muted, #948aa7);
      margin: 0 0 5px;
      font-weight: 500;
    }
    .back .section p {
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
      color: var(--card-back-text, #e9e4f2);
      font-weight: 400;
      /* Сохраняем \n из JSON как переносы строк (для буллетов в секциях) */
      white-space: pre-line;
    }

    /* Variant carousel — несколько направлений одного проекта (e.g. CineShift
       для физлиц / для юрлиц). На обороте карта показывает один вариант, dots
       снизу + горизонтальный swipe переключают между вариантами. */
    .back .variant-carousel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .back .variant-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }
    .back .variant-track {
      display: flex;
      height: 100%;
      transition: transform 480ms cubic-bezier(.32,.72,0,1);
      touch-action: pan-y;
    }
    .back .variant-page {
      flex: 0 0 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      /* Никакого спец-padding'a — структура внутри (back-top, tagline,
         scroll, pills, cta) полностью повторяет обычную back-сторону.
         Каждая страница карусели — точная копия одиночной back-карточки. */
      padding: 0;
    }
    .back .variant-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--card-back-muted, rgba(255,255,255,0.50));
      margin: 0 0 3px;
    }
    .back .variant-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 10px 0 4px;
      flex-shrink: 0;
    }
    .back .variant-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--card-back-dot, rgba(255,255,255,0.25));
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background 240ms ease, transform 240ms ease;
    }
    .back .variant-dot.active {
      background: var(--card-back-text, rgba(255,255,255,0.90));
      transform: scale(1.15);
    }
    .back .variant-dot:hover { background: var(--card-back-subtle, rgba(255,255,255,0.50)); }

    /* Старые селекторы карусели-стрелок остаются для обратной совместимости
       (на случай если cards.json со старой версией). Сейчас не используются. */
    .back .variant-carousel { position: relative; overflow: visible; }

    /* Card-nav — кнопки навигации по сёстрам, рендерятся ПОВЕРХ карты
       (как прямые дети .card, не внутри .face). Так они не зажаты в
       overflow: hidden и не участвуют в 3D-флипе. Сидят ВНУТРИ карточки
       по бокам, с лёгким зазором от края. */
    .card-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(20,20,24,0.55);
      border: 0.5px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.94);
      cursor: pointer;
      display: none;             /* по умолчанию скрыты, показываем когда карта flipped */
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
      font-family: inherit;
      padding: 0;
      z-index: 200;              /* поверх всей карточной поверхности */
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.20),
        inset 0 0 0 0.5px rgba(255,255,255,0.08),
        0 3px 10px rgba(0,0,0,0.35);
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }
    .card-nav:hover { background: rgba(40,40,46,0.72); }
    .card-nav:active { transform: translateY(-50%) scale(0.92); }
    .card-nav[aria-disabled="true"] {
      opacity: 0.32;
      cursor: default;
      pointer-events: auto;
    }
    /* Только на десктопе показываем стрелки и выносим их за пределы
       карточки в gap-зону между профилем и стопкой. На мобильных
       пользователи листают свайпом или тапают по точкам внизу. */
    @media (min-width: 960px) {
      .card.is-flipped .card-nav { display: inline-flex; }
      .card-nav.prev { left: -46px; }
      .card-nav.next { right: -46px; }
    }

    /* Directions — sub-projects inside one project (e.g. TSOH: clothing + parfum).
       Each is a tappable glass row between sections and pills. */
    .back .directions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .back .direction {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--card-back-control-bg, rgba(255,255,255,0.06));
      border-radius: 12px;
      text-decoration: none;
      color: var(--card-back-text, var(--text));
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 0 0 0.5px rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.08);
      transition: background 160ms ease, transform 100ms ease;
    }
    .back .direction:hover { background: var(--card-back-control-hover, rgba(255,255,255,0.10)); }
    .back .direction:active { transform: scale(0.98); }
    .back .direction .dir-body { flex: 1; min-width: 0; }
    .back .direction .dir-title {
      font-size: 14px; font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--card-back-text, rgba(255,255,255,0.94));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .back .direction .dir-desc {
      font-size: 12px;
      color: var(--card-back-muted, rgba(255,255,255,0.55));
      margin-top: 2px;
      letter-spacing: -0.005em;
      line-height: 1.3;
    }
    .back .direction .dir-arrow {
      color: var(--card-back-muted, rgba(255,255,255,0.45));
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Frosted-glass pills */
    .back .pills {
      display: flex; flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .back .pill {
      display: inline-flex; align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--card-back-control-bg, rgba(255,255,255,0.06));
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--card-back-text, rgba(255,255,255,0.94));
      text-decoration: none;
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      /* Glass pill: top highlight, hairline, soft bottom shadow */
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 0 0 0.5px rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.10);
      transition: background 160ms ease;
    }
    .back .pill:hover { background: var(--card-back-control-hover, rgba(255,255,255,0.10)); }
    .back .pill svg { width: 13px; height: 13px; }

    /* CTA */
    .back .goto {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--card-back-cta-bg, rgba(255,255,255,0.98));
      color: var(--card-back-cta-text, #0a0a0e);
      border-radius: 13px;
      padding: 13px 16px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: transform 120ms ease, background 160ms ease;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.10);
    }
    .back .goto:active { transform: scale(0.97); }
    .back .goto.disabled {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    /* Actions / contacts */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 0 0 28px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.005em;
      /* Real frosted glass */
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 0 0 0.5px rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.10),
        0 1px 2px rgba(0,0,0,0.25),
        0 8px 18px rgba(0,0,0,0.30);
      transition: background 180ms ease, transform 120ms ease;
    }
    .action-btn:hover { background: rgba(255,255,255,0.10); }
    .action-btn:active { transform: scale(0.97); }
    .action-btn svg { width: 18px; height: 18px; }

    /* Footer */
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 4px;
      position: relative;
    }
    /* Hairline separator above footer */
    .footer::before {
      content: '';
      display: block;
      width: 48px;
      height: 0.5px;
      background: var(--hairline);
      margin-bottom: 16px;
    }
    .footer .brand-row {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #b7afc7;
      letter-spacing: -0.005em;
      background: none; border: none; padding: 0; margin: 0;
      cursor: pointer; font-family: inherit;
      transition: color 200ms ease, transform 200ms ease;
    }
    .footer .brand-row:hover { color: #fffaff; }
    .footer .brand-row:active { transform: scale(0.97); }
    .footer .brand-row img {
      width: auto; height: 40px;
      opacity: 0.92;
    }
    .footer > span:last-child {
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 400;
    }

    /* === Пасхалка: cosmic mode ===
       Тап по «Vozhakin Group» в футере прячет весь контент на 30 сек.
       Виден только звёздный фон и периодические падающие звёзды. */
    /* Базовый transition: opacity + transform на 800ms iOS-spring. Применяется
       и при входе в cosmic-mode (быстрое затухание), и при выходе. На выходе
       к каждому элементу добавляется свой transition-delay через .cosmic-revealing —
       элементы возникают волной сверху вниз. */
    .profile, .stack, #contacts, .footer {
      transition: opacity 800ms cubic-bezier(.32,.72,0,1),
                  transform 800ms cubic-bezier(.32,.72,0,1);
    }
    body.cosmic-mode .profile,
    body.cosmic-mode .stack,
    body.cosmic-mode #contacts,
    body.cosmic-mode .footer {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.985);
    }
    /* Блокировка скролла на время cosmic-mode и reveal-волны после выхода.
       Страница становится точно по высоте viewport, скроллбар не виден —
       пустое чёрное небо без полосы прокрутки сбоку, и пользователь не
       уезжает вниз случайным жестом во время анимации. */
    html.cosmic-locked,
    body.cosmic-mode,
    body.cosmic-revealing {
      overflow: hidden !important;
      /* 100dvh — динамический viewport на мобильных, учитывает скрытие URL-бара.
         Fallback на 100vh для старых браузеров. */
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      /* Кэф на iOS Safari: starfield/meteors используют position:fixed,
         поэтому всегда покрывают видимую часть экрана. */
      position: fixed;
      width: 100%;
      top: 0; left: 0;
    }
    /* Поэтапное появление при выходе — класс cosmic-revealing держится
       пока идёт reveal-волна, потом снимается JS-таймером. */
    body.cosmic-revealing .profile  { transition-delay: 0ms;   }
    body.cosmic-revealing .stack    { transition-delay: 220ms; }
    body.cosmic-revealing #contacts { transition-delay: 440ms; }
    body.cosmic-revealing .footer   { transition-delay: 620ms; }
    .cosmic-hint {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.42); pointer-events: none;
      opacity: 0; transition: opacity 800ms ease 600ms;
      z-index: 100; font-family: inherit;
    }
    body.cosmic-mode .cosmic-hint { opacity: 1; }
    /* Метеор = тонкая полоса со сквозным градиентом (хвост) + сияющая
       голова через ::after. Цвет задаётся через CSS-переменные, что позволяет
       рендерить разноцветные метеоры (белые, синие, зелёные, жёлтые,
       фиолетовые, огненные) одной общей таблицей правил. */
    .meteor {
      /* Базовые цвета — по умолчанию синие (default fallback) */
      --tail-mid:    rgba(110, 175, 255, 0.65);
      --tail-bright: rgba(160, 210, 255, 0.95);
      --tail-tip:    #c8e0ff;
      --streak-glow: rgba(100, 180, 255, 0.85);
      --head-halo1:  rgba(120, 190, 255, 0.95);
      --head-halo2:  rgba(60, 140, 255, 0.55);
      --head-halo3:  rgba(40, 100, 240, 0.28);
      position: fixed;
      pointer-events: none;
      z-index: 1;
      width: var(--len, 240px);
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.10) 18%,
        var(--tail-mid) 55%,
        var(--tail-bright) 92%,
        var(--tail-tip, #ffffff) 100%);
      border-radius: 999px;
      filter: drop-shadow(0 0 3px var(--streak-glow));
      opacity: 0;
      transform-origin: 100% 50%;
      animation: meteor-streak 1.8s linear forwards;
      will-change: transform, opacity;
    }
    .meteor::after {
      /* Сияющая голова — белое ядро всегда (горячее), цветной ореол */
      content: '';
      position: absolute;
      right: -3px;
      top: -3.5px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle,
        #ffffff 0%,
        rgba(255, 255, 255, 0.95) 30%,
        var(--head-halo2) 60%,
        transparent 90%);
      box-shadow:
        0 0 10px 2px var(--head-halo1),
        0 0 22px 6px var(--head-halo2),
        0 0 40px 12px var(--head-halo3);
      filter: blur(0.4px);
    }
    .meteor::before {
      /* Тонкое искрящее жало перед головой — добавляет ощущение скорости */
      content: '';
      position: absolute;
      right: -1px;
      top: -0.5px;
      width: 14px;
      height: 3px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.8) 60%,
        #ffffff 100%);
      border-radius: 999px;
      filter: blur(0.5px);
    }
    /* === Цветовые палитры метеоров ===
       Каждый класс переопределяет 6 CSS-переменных, что меняет цвет
       хвоста, ореола и свечения. Голова остаётся бело-горячей. */
    .meteor.color-white {
      --tail-mid:    rgba(255, 255, 255, 0.70);
      --tail-bright: rgba(255, 255, 255, 0.95);
      --tail-tip:    #ffffff;
      --streak-glow: rgba(255, 255, 255, 0.90);
      --head-halo1:  rgba(255, 255, 255, 0.95);
      --head-halo2:  rgba(255, 255, 255, 0.50);
      --head-halo3:  rgba(255, 255, 255, 0.25);
    }
    .meteor.color-blue {
      --tail-mid:    rgba(80, 160, 255, 0.70);
      --tail-bright: rgba(140, 200, 255, 0.95);
      --tail-tip:    #a8d0ff;
      --streak-glow: rgba(70, 160, 255, 0.90);
      --head-halo1:  rgba(100, 180, 255, 0.95);
      --head-halo2:  rgba(50, 130, 255, 0.60);
      --head-halo3:  rgba(30, 95, 240, 0.30);
    }
    .meteor.color-green {
      --tail-mid:    rgba(80, 240, 160, 0.72);
      --tail-bright: rgba(140, 255, 190, 0.95);
      --tail-tip:    #a8ffd0;
      --streak-glow: rgba(70, 250, 150, 0.90);
      --head-halo1:  rgba(90, 250, 160, 0.95);
      --head-halo2:  rgba(40, 220, 110, 0.60);
      --head-halo3:  rgba(20, 180, 70, 0.30);
    }
    .meteor.color-yellow {
      --tail-mid:    rgba(255, 220, 80, 0.72);
      --tail-bright: rgba(255, 240, 150, 0.95);
      --tail-tip:    #fff0a0;
      --streak-glow: rgba(255, 210, 60, 0.90);
      --head-halo1:  rgba(255, 215, 70, 0.95);
      --head-halo2:  rgba(255, 175, 25, 0.60);
      --head-halo3:  rgba(230, 145, 10, 0.30);
    }
    .meteor.color-purple {
      --tail-mid:    rgba(190, 110, 255, 0.72);
      --tail-bright: rgba(220, 175, 255, 0.95);
      --tail-tip:    #d8b8ff;
      --streak-glow: rgba(180, 90, 255, 0.90);

    /* ----- Helpers ----- */
    function hexToHsl(hex) {
      hex = String(hex || '').replace('#','');
      if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
      if (!/^[0-9a-fA-F]{6}$/.test(hex)) hex = '888888';
      const r = parseInt(hex.slice(0,2),16)/255;
      const g = parseInt(hex.slice(2,4),16)/255;
      const b = parseInt(hex.slice(4,6),16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch (max) {
          case r: h = (g-b)/d + (g < b ? 6 : 0); break;
          case g: h = (b-r)/d + 2; break;
          case b: h = (r-g)/d + 4; break;
        }
        h /= 6;
      }
      return { h: h*360, s: s*100, l: l*100 };
    }
    function gradientFor(hex) {
      // Confident linear base; the specular sheen on .face::after handles the
      // glass highlight so the gradient itself stays a touch deeper.
      const { h, s, l } = hexToHsl(hex);
      const top = `hsl(${h.toFixed(0)} ${Math.min(82, s+4).toFixed(0)}% ${Math.min(56, l+5).toFixed(0)}%)`;
      const bot = `hsl(${h.toFixed(0)} ${Math.max(28, s-10).toFixed(0)}% ${Math.max(10, l-28).toFixed(0)}%)`;
      return `linear-gradient(165deg, ${top} 0%, ${bot} 100%)`;
    }
    function urlHost(url) {
      try { return new URL(url).host.replace(/^www\./,''); } catch { return ''; }
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /* ----- Data loading ----- */
    async function loadData() {
      try {
        const res = await fetch('cards.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('no file');
        return await res.json();
      } catch (e) {
        return FALLBACK;
      }
    }

    const MOTION_DEFAULTS = {
      enabled: true,
      extractLift: 16,
      extractScale: 1.018,
      flipDuration: 760,
      springDuration: 620,
      glare: 0.22
    };
    let motionSettings = { ...MOTION_DEFAULTS };

    function clampNumber(value, min, max, fallback) {
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
    }

    function applyMotionSettings(settings) {
      motionSettings = { ...MOTION_DEFAULTS, ...(settings || {}) };
      const enabled = motionSettings.enabled !== false && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const root = document.documentElement;
      root.dataset.motion = enabled ? 'on' : 'off';
      const extractLift = enabled ? clampNumber(motionSettings.extractLift, 0, 36, 16) : 0;
      root.style.setProperty('--motion-extract-y', `${-extractLift}px`);
      root.style.setProperty('--motion-profile-y', `${-(extractLift * .55)}px`);
      root.style.setProperty('--motion-profile-z', enabled ? '22px' : '0px');
      root.style.setProperty('--motion-profile-scale', enabled ? '1.008' : '1');
      root.style.setProperty('--motion-extract-scale', String(enabled ? clampNumber(motionSettings.extractScale, 1, 1.06, 1.018) : 1));
      root.style.setProperty('--motion-flip-ms', `${clampNumber(motionSettings.flipDuration, 240, 1400, 760)}ms`);
      root.style.setProperty('--motion-spring-ms', `${clampNumber(motionSettings.springDuration, 240, 1400, 620)}ms`);
      root.style.setProperty('--motion-glare-opacity', String(enabled ? clampNumber(motionSettings.glare, 0, .5, .22) : 0));
    }

    function bindPhysicalMotion(card) {
      if (!card || card.dataset.motionBound === '1') return;
      card.dataset.motionBound = '1';
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let frame = 0;
      let latestEvent = null;
      let leaveTimer = 0;

      const reset = () => {
        cancelAnimationFrame(frame);
        frame = 0;
        latestEvent = null;
        card.style.setProperty('--glare-x', '50%');
        card.style.setProperty('--glare-y', '35%');
        clearTimeout(leaveTimer);
        leaveTimer = window.setTimeout(() => card.classList.remove('is-pointer-tracking'), 150);
      };
      card._resetPhysicalMotion = reset;

      card.addEventListener('pointermove', event => {
        if (!finePointer.matches || reducedMotion.matches || motionSettings.enabled === false || event.pointerType === 'touch') return;
        const isProjectCard = card.classList.contains('card');
        const motionLocked = card.classList.contains('is-flipped') || (isProjectCard && !card.classList.contains('is-active'));
        if (motionLocked) {
          if (card.classList.contains('is-pointer-tracking')) reset();
          return;
        }
        latestEvent = event;
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          if (!latestEvent) return;
          const rect = card.getBoundingClientRect();
          const nx = Math.max(-1, Math.min(1, ((latestEvent.clientX - rect.left) / rect.width - .5) * 2));
          const ny = Math.max(-1, Math.min(1, ((latestEvent.clientY - rect.top) / rect.height - .5) * 2));
          clearTimeout(leaveTimer);
          card.classList.add('is-pointer-tracking');
          card.style.setProperty('--glare-x', `${(50 + nx * 34).toFixed(1)}%`);
          card.style.setProperty('--glare-y', `${(42 + ny * 32).toFixed(1)}%`);
        });
      });
      card.addEventListener('pointerleave', reset);
      card.addEventListener('pointercancel', reset);
    }

    /* ----- Renderers ----- */
    function renderProfile(p) {
      const about = Array.isArray(p.about) ? p.about : [];
      // First about section without a title (the manifesto) is shown inline on
      // desktop. CSS hides .front-manifesto on mobile.

      document.getElementById('profile').innerHTML = `
        <article class="profile-card" id="profile-card" aria-label="Профиль ${escapeHtml(p.name)}">
          <div class="card-inner">
            <div class="face front">

              <div class="name-block">

                <p>${escapeHtml(p.title || '')}</p>
                ${manifesto ? `<p class="front-manifesto">${escapeHtml(manifesto)}</p>` : ''}
              </div>
            </div>
            <div class="face back">
              <div class="back-top">
                <div class="back-title">
                  ${p.type ? `<p class="back-type">${escapeHtml(p.type)}</p>` : ''}
                  <h3>${escapeHtml(p.name)}</h3>

                <button class="close-btn" type="button" aria-label="Закрыть" data-close>${ICON_CLOSE}</button>

                  <div class="section">

                    <p>${escapeHtml(s.body || '')}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </article>
      `;
      const card = document.getElementById('profile-card');
      bindPhysicalMotion(card);
      requestAnimationFrame(() => card.classList.add('ready'));
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-close]')) {
          card.classList.remove('is-flipped');
          if (typeof card._resetPhysicalMotion === 'function') card._resetPhysicalMotion();
          return;
        }
        card.classList.toggle('is-flipped');
        if (card.classList.contains('is-flipped') && typeof card._resetPhysicalMotion === 'function') card._resetPhysicalMotion();
      });
    }
    function renderContacts(items) {
      const el = document.getElementById('contacts');
      if (!items || !items.length) { el.style.display = 'none'; return; }
      el.innerHTML = items.map(c => `
        <a class="action-btn" href="${c.url}" target="_blank" rel="noopener noreferrer">
          ${ICONS[c.icon] || ICONS.link}<span>${escapeHtml(c.label)}</span>
        </a>

    function renderFooter(f) {
      document.getElementById('footer').innerHTML = `

        <span>© ${(f && f.year) || new Date().getFullYear()}</span>
